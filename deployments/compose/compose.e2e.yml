# make test-e2e: a throwaway install (test-mode SPA, data in tmpfs, fixed setup token, no published ports) and the
# Playwright runner on the same network.
name: meethub-e2e

services:
  meethub:
    image: ${E2E_IMAGE:-meethub:e2e}
    environment:
      MEETHUB_SETUP_TOKEN: e2e-setup-token
      MEETHUB_HTTP_PUBLIC_URL: http://meethub:8080
    volumes: !override
      - ../../config.toml:/etc/meethub/config.toml:ro
    tmpfs:
      - /data:uid=65532,gid=65532
    ports: !reset []

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["runner"]
    working_dir: /work
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://meethub:8080
      E2E_REDIS_ADDR: redis:6379 # the Redis restart test
      E2E_ARGS: ${E2E_ARGS:-}
      npm_config_update_notifier: "false"
    volumes:
      - ../../frontend:/work
    # the project's locked dependencies, installed in the runner itself (never the host's node_modules)
    tmpfs:
      - /work/node_modules:uid=${E2E_UID:-1000},gid=${E2E_GID:-1000},exec,size=2g
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test $$E2E_ARGS"]
