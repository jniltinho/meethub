# make test-e2e: a throwaway install (test-mode SPA, data in tmpfs, fixed setup token, no published ports) and the
# Playwright runner on the same network.
name: meethub-e2e

services:
  meethub:
    image: ${E2E_IMAGE:-meethub:e2e}
    environment:
      MEETHUB_SETUP_TOKEN: e2e-setup-token
      MEETHUB_SECRET_KEY: ZTJlLXRocm93YXdheS1zZWNyZXQta2V5LTMyYnl0ZXM= # "e2e-throwaway-secret-key-32bytes"
      MEETHUB_HTTP_PUBLIC_URL: http://meethub:8080
      MEETHUB_LIVEKIT_URL: ws://livekit:7880
      # single sign-on against the throwaway provider below (its certificate is made at start: trust only it)
      MEETHUB_OIDC_ISSUER: https://idp:9443
      MEETHUB_OIDC_CLIENT_ID: meethub-e2e
      MEETHUB_OIDC_CLIENT_SECRET: e2e-throwaway-client-secret
      MEETHUB_OIDC_NAME: Acme ID
      MEETHUB_OIDC_AUTO_CREATE: "true"
      MEETHUB_OIDC_ALLOWED_DOMAINS: example.com
      SSL_CERT_FILE: /idp/cert.pem
      MEETHUB_RECORDINGS_ENABLED: "true" # tests/e2e/12-recordings.spec.ts; the image's own ffmpeg
      # meeting summaries against the fake AI service below (tests/e2e/14-summaries.spec.ts); off until a test turns them on
      MEETHUB_AI_BASE_URL: http://ai:8090/v1
      MEETHUB_AI_API_KEY: e2e-throwaway-ai-key
      MEETHUB_AI_TRANSCRIPTION_MODEL: fake-whisper
      MEETHUB_AI_SUMMARY_MODEL: fake-writer
    # under the settings applier as compose.settings.yml runs it (tests/e2e/15-settings.spec.ts): it runs the server
    # as a child, applies the changes of Administration → Settings to /data/config/config.toml, a copy of
    # config.toml, and restarts it; 20 s to confirm
    command: ["--config", "/data/config/config.toml", "settings-applier", "--supervise", "--seed-config", "/etc/meethub/config.toml", "--confirm-window", "20s", "--max-per-hour", "10"]
    volumes: !override
      - ../../config.toml:/etc/meethub/config.toml:ro
      - idp:/idp:ro
    depends_on:
      idp:
        condition: service_healthy
      ai:
        condition: service_started
    tmpfs:
      - /data:uid=65532,gid=65532
    ports: !reset []

  # LiveKit advertises its container address (no --node-ip), which the runner reaches on this network
  livekit:
    command: !reset []
    ports: !reset []

  # a throwaway OpenID Connect provider for the single sign-on tests (frontend/tests/e2e/idp/server.mjs)
  idp:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /work
    volumes:
      - ../../frontend/tests/e2e/idp:/work:ro
      - idp:/idp
    command: ["sh", "-c", "rm -f /idp/ready && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=idp -addext subjectAltName=DNS:idp -keyout /idp/key.pem -out /idp/cert.pem 2>/dev/null && chmod 644 /idp/cert.pem && exec node server.mjs"]
    healthcheck:
      test: ["CMD", "test", "-f", "/idp/ready"]
      interval: 1s
      timeout: 3s
      retries: 30

  # a fake OpenAI-compatible AI service for the meeting summaries tests (frontend/tests/e2e/ai/server.mjs)
  ai:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /work
    volumes:
      - ../../frontend/tests/e2e/ai:/work:ro
    command: ["node", "server.mjs"]

  playwright:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["runner"]
    working_dir: /work
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://meethub:8080
      E2E_REDIS_ADDR: redis:6379 # the Redis restart test
      E2E_ARGS: ${E2E_ARGS:-}
      npm_config_update_notifier: "false"
    volumes:
      - ../../frontend:/work
    # the project's locked dependencies, installed in the runner itself (never the host's node_modules)
    tmpfs:
      - /work/node_modules:uid=${E2E_UID:-1000},gid=${E2E_GID:-1000},exec,size=2g
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test $$E2E_ARGS"]

volumes:
  idp:
