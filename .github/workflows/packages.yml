name: Packages

# The Linux packages (packaging/: meethub_<version>_amd64.deb, meethub-<version>-1.x86_64.rpm,
# meethub_<version>_linux_amd64.tar.gz, SHA256SUMS)
# are built for linux/amd64 and tested on every pull request, push to main and v* tag:
#   - packaging/smoke.sh installs them in clean Debian, Ubuntu and AlmaLinux containers
#   - the .deb is installed on the runner itself, where systemd really starts meethub.service
# A v* tag then publishes the four files as the assets of that tag's GitHub release, with the workflow's own
# token. Lint and the test suites run in ci.yml; tag a commit of main that passed it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: deb, rpm and tar.gz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # only the last step uses it: the release of a v* tag
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and install in clean containers
        run: make test-package VERSION="$VERSION" COMMIT="$GITHUB_SHA"
      - name: Install on the runner, under systemd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/packages/meethub_*_amd64.deb
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/v1/ready && break
            sleep 1
          done
          systemctl is-active meethub.service
          curl -fsS http://127.0.0.1:8080/api/v1/ready
          sudo systemctl restart meethub.service
          sudo systemctl stop meethub.service
          test "$(systemctl show -p Result --value meethub.service)" = success
      - name: Service log
        if: failure()
        run: sudo journalctl -u meethub.service --no-pager | tail -n 80
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # create uploads the files to a draft and publishes it only when all are there. A release that already
        # exists (made by hand, or a re-run) only gets the files it lacks: a complete one is left alone.
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/packages/* --verify-tag --title "MeetHub $TAG" --generate-notes
          elif [ "$(gh release view "$TAG" --json assets --jq '.assets | length')" -lt 4 ]; then
            gh release upload "$TAG" dist/packages/* --clobber
          fi
