name: Docker image

# The all-in-one image (the server and Redis under supervisord, Dockerfile target `allinone`) is built for
# linux/amd64 and smoke tested (docker/allinone/smoke.sh: healthy, ready, data kept across a new container) on
# every pull request, push to main and v* tag. Pushes to main and v* tags then publish it to the repository's
# package, ghcr.io/<owner>/meethub, with the workflow's own token — no registry secrets:
#   main  →  main-allinone, sha-<short>-allinone
#   vX.Y.Z  →  X.Y.Z-allinone, X.Y-allinone, allinone, sha-<short>-allinone
# The -allinone suffix leaves the plain tags free for the minimal runtime image. Lint and the test suites run in
# ci.yml; tag a commit of main that passed it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Release tags share one group: two tags pushed close together publish in order, so the older run cannot finish
# last and move `allinone` and `X.Y-allinone` back.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'docker-image-release' || format('docker-image-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  allinone:
    name: All-in-one image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-allinone
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=allinone,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: stamp
        run: echo "buildtime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: allinone
          platforms: linux/amd64
          load: true
          tags: meethub:smoke-allinone
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ steps.stamp.outputs.buildtime }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker/allinone/smoke.sh meethub:smoke-allinone
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the same build again, every layer from the builder's cache: what was tested is what is pushed
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: allinone
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ steps.stamp.outputs.buildtime }}
          cache-from: type=gha
