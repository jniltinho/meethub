<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="864" viewBox="0 0 1200 864" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Running more than one replica</title>
  <desc>People → Load balancer / reverse proxy → three MeetHub replica boxes. Each replica → PostgreSQL or MariaDB, Redis, S3 bucket and LiveKit. People → LiveKit: media (dashed).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#b3b8ff"/>
    </marker>
  </defs>
  <rect width="1200" height="864" rx="8" fill="#0c1020"/>
  <g id="edge-users-lb" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 600 152 V 224" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-lb-m1" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 600 310 V 368 H 216 V 424" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-lb-m2" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 600 310 V 368 H 600 V 424" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-lb-m3" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 600 310 V 368 H 984 V 424" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-replicas-stores" fill="none" stroke="#797cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 216 504 V 608"/>
  <path d="M 600 504 V 608"/>
  <path d="M 984 504 V 608"/>
  <path d="M 184 608 H 1004"/>
  <path d="M 184 608 V 728" marker-end="url(#arrow)"/>
  <path d="M 456 608 V 728" marker-end="url(#arrow)"/>
  <path d="M 728 608 V 728" marker-end="url(#arrow)"/>
  <path d="M 1004 608 V 728" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-users-lk" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 724 120 H 1152 V 778 H 1128" stroke="#797cff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  </g>
  <g id="node-users">
  <rect x="476" y="88" width="248" height="64" rx="32.0" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="600.0" y="125.0" font-size="15" font-weight="600">People</tspan>
  </text></g>
  <g id="node-lb">
  <rect x="396" y="224" width="408" height="86" rx="8" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="600.0" y="262.0" font-size="15" font-weight="600">Load balancer / reverse proxy</tspan>
  <tspan x="600.0" y="282.0" font-size="13" font-weight="400">TLS, WebSocket upgrades</tspan>
  </text></g>
  <g id="node-m1">
  <rect x="72" y="424" width="288" height="80" rx="8" fill="#3d41cf" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="216.0" y="469.0" font-size="15" font-weight="600">MeetHub replica</tspan>
  </text></g>
  <g id="node-m2">
  <rect x="456" y="424" width="288" height="80" rx="8" fill="#3d41cf" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="600.0" y="469.0" font-size="15" font-weight="600">MeetHub replica</tspan>
  </text></g>
  <g id="node-m3">
  <rect x="840" y="424" width="288" height="80" rx="8" fill="#3d41cf" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="984.0" y="469.0" font-size="15" font-weight="600">MeetHub replica</tspan>
  </text></g>
  <g id="node-pg">
  <path d="M 64 742 L 64 802 C 64 820 304 820 304 802 L 304 742 Z" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <ellipse cx="184" cy="742" rx="120" ry="14" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="184.0" y="785.0" font-size="15" font-weight="600">PostgreSQL or MariaDB</tspan>
  </text></g>
  <g id="node-redis">
  <path d="M 336 742 L 336 802 C 336 820 576 820 576 802 L 576 742 Z" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <ellipse cx="456" cy="742" rx="120" ry="14" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="456.0" y="785.0" font-size="15" font-weight="600">Redis</tspan>
  </text></g>
  <g id="node-s3">
  <path d="M 608 742 L 608 802 C 608 820 848 820 848 802 L 848 742 Z" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <ellipse cx="728" cy="742" rx="120" ry="14" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="728.0" y="785.0" font-size="15" font-weight="600">S3 bucket</tspan>
  </text></g>
  <g id="node-lk">
  <rect x="880" y="728" width="248" height="88" rx="8" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="1004.0" y="777.0" font-size="15" font-weight="600">LiveKit</tspan>
  </text></g>
  <g id="label-users-lk"><rect x="917.8" y="106.0" width="60.4" height="28" rx="8" fill="#151b31"/><text text-anchor="middle" fill="#b3b8ff" font-size="13">
  <tspan x="948" y="124.5">media</tspan>
  </text></g>
</svg>
