  <line id="lifeline-B" x1="1044" y1="152" x2="1044" y2="1120" stroke="#797cff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45"/>
  <g id="node-A">
  <rect x="46.0" y="64" width="220" height="88" rx="44" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="156.0" y="113.0" font-size="15" font-weight="600">Ana's browser</tspan>
  </text></g>
  <g id="node-S">
  <rect x="342.0" y="64" width="220" height="88" rx="8" fill="#3d41cf" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="452.0" y="113.0" font-size="15" font-weight="600">MeetHub</tspan>
  </text></g>
  <g id="node-L">
  <rect x="638.0" y="64" width="220" height="88" rx="8" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="748.0" y="113.0" font-size="15" font-weight="600">LiveKit</tspan>
  </text></g>
  <g id="node-B">
  <rect x="934.0" y="64" width="220" height="88" rx="44" fill="#151b31" stroke="#797cff" stroke-width="1.5"/>
  <text text-anchor="middle" fill="#f2f4fb">
  <tspan x="1044.0" y="113.0" font-size="15" font-weight="600">Other members</tspan>
  </text></g>
  <g id="edge-1" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 156 232 H 452" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="step-1"><circle cx="38" cy="232" r="12" fill="#151b31" stroke="#797cff" stroke-width="1.5"/><text x="38" y="236.5" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4fb">1</text></g>
