  <g id="label-6"><rect x="561.28" y="662.0" width="373.44" height="28" rx="8" fill="#151b31"/><text text-anchor="middle" fill="#b3b8ff" font-size="13">
  <tspan x="748" y="680.5">WebSocket "meeting_updated" (who is in the room)</tspan>
  </text></g>
  <g id="edge-7" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 156 904 H 748" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="step-7"><circle cx="38" cy="904" r="12" fill="#151b31" stroke="#797cff" stroke-width="1.5"/><text x="38" y="908.5" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4fb">7</text></g>
  <g id="label-7"><rect x="421.8" y="854.0" width="60.4" height="28" rx="8" fill="#151b31"/><text text-anchor="middle" fill="#b3b8ff" font-size="13">
  <tspan x="452" y="872.5">leave</tspan>
  </text></g>
  <g id="edge-8" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 748 1000 H 452" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="step-8"><circle cx="38" cy="1000" r="12" fill="#151b31" stroke="#797cff" stroke-width="1.5"/><text x="38" y="1004.5" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4fb">8</text></g>
  <g id="label-8"><rect x="471.52" y="950.0" width="256.96" height="28" rx="8" fill="#151b31"/><text text-anchor="middle" fill="#b3b8ff" font-size="13">
  <tspan x="600" y="968.5">signed webhook: participant left</tspan>
  </text></g>
  <g id="edge-9" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 452 1096 H 1044" stroke="#797cff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
