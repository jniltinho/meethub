<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="1160" viewBox="0 0 1200 1160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>A meeting, end to end</title>
  <desc>1. A → S: POST /api/v1/channels/:id/meeting/token; 2. S → S: can Ana read the channel? is it archived?; 3. S → A: a 2-minute token for that one room, and LiveKit's address; 4. A → L: connect with the token (WebRTC); 5. L → S: signed webhook: participant joined; 6. S → B: WebSocket "meeting_updated" (who is in the room); 7. A → L: leave; 8. L → S: signed webhook: participant left; 9. S → B: WebSocket "meeting_updated"; every 3 s MeetHub compares its list with LiveKit's, so a missed webhook heals</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#b3b8ff"/>
    </marker>
  </defs>
  <rect width="1200" height="1160" rx="8" fill="#0c1020"/>
  <line id="lifeline-A" x1="156" y1="152" x2="156" y2="1120" stroke="#797cff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45"/>
  <line id="lifeline-S" x1="452" y1="152" x2="452" y2="1120" stroke="#797cff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.45"/>
