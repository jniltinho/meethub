  <tspan x="452" y="488.5">connect with the token (WebRTC)</tspan>
  </text></g>
  <g id="edge-5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 748 616 H 452" stroke="#797cff" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <g id="step-5"><circle cx="38" cy="616" r="12" fill="#151b31" stroke="#797cff" stroke-width="1.5"/><text x="38" y="620.5" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f4fb">5</text></g>
  <g id="label-5"><rect x="464.24" y="566.0" width="271.52" height="28" rx="8" fill="#151b31"/><text text-anchor="middle" fill="#b3b8ff" font-size="13">
