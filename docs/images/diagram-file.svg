  <title>A file, end to end</title>
  <desc>1. A → S: POST /api/v1/files (channel, then the file as a stream); 2. S → D: may this person post in the channel?; 3. S → F: put the bytes as they arrive (size cap, type sniffed); 4. S → F: images: read back, make a thumbnail and a preview; 5. S → D: file info (not attached yet); 6. S → A: 201 file info; 7. A → S: POST /api/v1/posts (file_ids); 8. S → D: one transaction: store the message, claim the files; 9. S → A: 201 the message with its files; hourly: remove deleted files and uploads never attached for 24 h</desc>
