; MeetHub all-in-one: Redis and the meethub server in one container, logs on stdout (docker logs).
; Nothing runs as root: the container starts as the meethub user (uid 65532), which owns /data.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; docker exec <container> supervisorctl status | restart meethub
; The socket is private to the container's only user (0700), so it has no password: supervisord logs one CRIT line
; about that at every start.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; required by meethub (background jobs, rate limits, presence, chat event bus). Loopback only, never published;
; append-only file in /data/redis like the Compose stack, so queued jobs survive a restart.
[program:redis]
command=/usr/local/bin/redis-server --bind 127.0.0.1 --port 6379 --protected-mode yes --dir /data/redis --appendonly yes
priority=10
autorestart=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; waits for Redis itself (redis.connect_timeout); stopped first, within http.shutdown_timeout (15s by default).
; The two stopwaitsecs add up to 40s: run the container with --stop-timeout 45 (docs/deployment.md)
[program:meethub]
command=/usr/local/bin/meethub server
directory=/data
priority=20
startsecs=3
startretries=10
autorestart=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
